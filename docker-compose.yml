services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: annotation
      POSTGRES_USER: annotation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annotation -d annotation"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis-data:/data]
    networks: [private]
  api:
    build: ./backend
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://annotation:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/annotation
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    networks: [private]
volumes:
  postgres-data:
  redis-data:
networks:
  private:
    driver: bridge
